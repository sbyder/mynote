<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8f7f2">
    <title>MyNote</title>
  </head>
  <body>
    <div class="workspace">
      <aside class="sidebar" id="sidebar" aria-label="笔记目录">
        <div class="brand"><span class="brand-icon" aria-hidden="true"></span>MyNote</div>
        <div class="directory">
          <label for="scope">笔记目录</label>
          <select id="scope" autocomplete="off"><option value="">全部笔记</option></select>
        </div>
        <div class="search">
          <input id="note-search" type="search" placeholder="搜索标题或正文" aria-label="搜索全部笔记" autocomplete="off" disabled>
        </div>
        <nav id="tree" aria-label="Markdown 文档"></nav>
        <div id="search-results" class="search-results" hidden></div>
        <div class="sidebar-footer" id="count"></div>
      </aside>
      <main class="main">
        <header class="topbar">
          <button id="sidebar-toggle" class="menu-button" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="打开笔记目录">☰</button>
          <div id="path" class="path"></div>
          <span id="status" class="status" role="status"></span>
          <button id="insert-demo" type="button" disabled>插入 HTML</button>
          <button id="theme-toggle" type="button" aria-pressed="false">暗夜模式</button>
          <button id="download" type="button" disabled>下载 .md</button>
        </header>
        <div class="reading-layout">
          <div class="scroll-area" id="scroll-area">
            <div class="document">
              <div id="message" class="message" role="status">正在读取笔记目录…</div>
              <div id="editor" aria-label="Markdown 编辑器"></div>
            </div>
          </div>
          <details class="outline" id="outline" hidden>
            <summary>标题目录</summary>
            <nav id="outline-links" aria-label="当前笔记的标题目录"></nav>
          </details>
        </div>
      </main>
    </div>
    <dialog id="html-demo-dialog" aria-labelledby="html-demo-label">
      <form>
        <label id="html-demo-label" for="html-demo-source">插入 HTML</label>
        <textarea id="html-demo-source" rows="12" required spellcheck="false" placeholder="粘贴 HTML、CSS 和 JavaScript"></textarea>
        <div class="dialog-actions">
          <button id="cancel-demo" type="button">取消</button>
          <button type="submit">插入</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
